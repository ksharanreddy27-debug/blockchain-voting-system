{% extends 'voting/base.html' %}{% block content %}<section class="panel"><h1>{{election.title}}</h1><p>{{election.description}}</p><h2>Select one candidate</h2><form method="post">{% csrf_token %}{% for c in candidates %}<label class="choice"><input type="radio" name="candidate" value="{{c.id}}" required><span><b>{{c.name}}</b><small>{{c.party}}</small><small>{{c.manifesto}}</small></span></label>{% empty %}<p>No candidates have been added.</p>{% endfor %}<button class="button">Submit vote</button></form></section>{% endblock %}
