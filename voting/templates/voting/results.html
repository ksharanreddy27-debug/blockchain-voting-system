{% extends 'voting/base.html' %}{% block content %}<section class="panel"><h1>Results: {{election.title}}</h1><p>Total votes: <b>{{total}}</b></p>{% for r in rows %}<div class="result"><div><b>{{r.candidate.name}}</b><span>{{r.count}} votes</span></div><div class="bar"><i style="width:{% if total %}{{r.percentage}}{% else %}0{% endif %}%"></i></div></div>{% endfor %}<p>Local ledger integrity: <b>{% if chain_ok %}Verified{% else %}Integrity check failed{% endif %}</b></p></section>{% endblock %}
